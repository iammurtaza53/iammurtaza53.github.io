# Builds the portfolio and publishes it to the gh-pages branch (served at murtazazoaib.com)
name: Portfolio
# Deploy on pushes to main, or run manually from the Actions tab
on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gh-pages-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check-out repository
        uses: actions/checkout@v4

      - name: Setup Node.js environment
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install project
        run: npm install

      - name: Build project
        run: npm run build

      # keep_files leaves the other pages on gh-pages in place;
      # cname rewrites the CNAME file so the custom domain survives every deploy
      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          keep_files: true
          cname: murtazazoaib.com
